name: publish

# Publishing a GitHub release uploads that version to PyPI through Trusted
# Publishing: PyPI trusts this workflow in this repository, so no token or
# password is stored anywhere. Configure the publisher once on pypi.org
# (project context-guardian-cli, workflow publish.yml, environment pypi).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/context-guardian-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Release tag must match the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - name: Tests
        run: uv run --no-project --python 3.13 python -B -m unittest discover -s tests
      - name: Build
        run: uv build --out-dir dist
      - name: Publish
        run: uv publish dist/*
